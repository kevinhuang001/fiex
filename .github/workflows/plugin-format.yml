name: Format plugin development branch
on:
  push:
    branches: [feat/plugin-sdk-extraction]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plugin-sdk-extraction
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npx prettier --write .github/workflows/plugin-validation.yml plugins/official/*/manifest.json scripts/package-plugins.mjs src-tauri/tauri.conf.json src/components src/lib src/styles docs/plugins sdk/ui
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path sdk/rust/Cargo.toml
      - run: cargo fmt --manifest-path plugins/official/git/Cargo.toml
      - run: cargo fmt --manifest-path plugins/official/webdav/Cargo.toml
      - run: cargo fmt --manifest-path plugins/official/smb/Cargo.toml
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows scripts src-tauri src docs/plugins sdk plugins/official
          if ! git diff --cached --quiet; then
            git commit -m 'style: format plugin work in progress'
            git push origin HEAD:feat/plugin-sdk-extraction
          fi
