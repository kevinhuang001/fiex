name: Temporary list-column formatter
on:
  pull_request:
    branches:
      - feat/unified-vfs-cache-preflight
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write src/lib/listColumns.test.ts
          echo "SINGLE_FILE_START"
          base64 -w 0 src/lib/listColumns.test.ts
          echo
          echo "SINGLE_FILE_END"
