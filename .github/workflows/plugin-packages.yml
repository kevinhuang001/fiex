name: Build optional Fiex plugin packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/official/**'
      - 'sdk/rust/**'
      - 'scripts/package-fiex-plugin.py'
      - '.github/workflows/plugin-packages.yml'
  push:
    tags:
      - 'plugins-v*'
permissions:
  contents: read
jobs:
  build:
    name: Plugin packages (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: plugin-package-${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and package
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        run: |
          set -euo pipefail
          python -m py_compile scripts/package-fiex-plugin.py
          for slug in git webdav smb archive checksum; do
            cargo test --manifest-path "plugins/official/${slug}/Cargo.toml" --target "${{ matrix.target }}"
            cargo build --release --manifest-path "plugins/official/${slug}/Cargo.toml" --target "${{ matrix.target }}"
            python scripts/package-fiex-plugin.py --slug "$slug" --target "${{ matrix.target }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fiex-plugins-${{ matrix.target }}
          path: dist/plugins/*.fiexplugin
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/plugins-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fiex-plugins-*
          path: dist/plugins
          merge-multiple: true
      - name: Publish Github Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/plugins/*.fiexplugin \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes "Optional Fiex plugins. User approval is required."
