name: Temporary refactor formatter
on:
  pull_request:
    branches:
      - feat/unified-vfs-cache-preflight
permissions:
  contents: read
jobs:
  generate-formatted-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write src
          rustup component add rustfmt
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - run: |
          git diff --name-only -z -- src src-tauri/src | while IFS= read -r -d '' file; do
            echo "FMT_FILE_START:$file"
            base64 -w 0 "$file"
            echo
            echo "FMT_FILE_END:$file"
          done
