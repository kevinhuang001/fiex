name: Test, build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Give every commit its own concurrency group. A stalled artifact upload in
# one run must not leave newer runs pending behind it forever.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  checks:
    name: Frontend and UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            artifacts/
            playwright-report/
            test-results/
  desktop:
    needs: checks
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev python3-venv
          version: 1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          cache-all-crates: true
          cache-on-failure: true
      - name: Start WebDAV test server
        shell: bash
        run: |
          set -euo pipefail
          PY=python3
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; fi
          "$PY" -m venv .ci/venv
          if [ "$RUNNER_OS" = "Windows" ]; then VPY=.ci/venv/Scripts/python.exe; else VPY=.ci/venv/bin/python; fi
          "$VPY" -m pip install -q --upgrade pip wsgidav cheroot impacket
          mkdir -p .ci/webdav
          printf 'hello webdav\n' > .ci/webdav/hello.txt
          ROOT="$PWD/.ci/webdav"
          if command -v cygpath >/dev/null 2>&1; then ROOT=$(cygpath -w "$ROOT"); fi
          "$VPY" -c 'from wsgidav.server.server_cli import run; run()' --host=127.0.0.1 --port=8080 --root="$ROOT" --auth=anonymous > .ci/wsgidav.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sS -X PROPFIND -H 'Depth: 1' http://127.0.0.1:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sS -X PROPFIND -H 'Depth: 1' http://127.0.0.1:8080/ >/dev/null || (cat .ci/wsgidav.log; exit 1)
      - name: Start SMB test server
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y samba smbclient
            mkdir -p /tmp/fiex-smb
            printf 'hello smb\n' > /tmp/fiex-smb/hello.txt
            chmod 777 /tmp/fiex-smb
            sudo useradd -M -s /usr/sbin/nologin fiex 2>/dev/null || true
            printf 'Zebra!2026#Quartz\nZebra!2026#Quartz\n' | sudo smbpasswd -a fiex -s
            cat > /tmp/fiex-smb.conf <<'EOF'
          [global]
            workgroup = WORKGROUP
            server role = standalone server
            security = user
            map to guest = Bad User
            server min protocol = SMB2
            smb ports = 445
          [fiex]
            path = /tmp/fiex-smb
            browseable = yes
            read only = no
            guest ok = yes
            valid users = fiex
            force user = fiex
          EOF
            sudo systemctl stop smbd 2>/dev/null || true
            sudo smbd -s /tmp/fiex-smb.conf -F --no-process-group > /tmp/fiex-smbd.log 2>&1 &
            for i in $(seq 1 20); do
              smbclient //127.0.0.1/fiex -U fiex%Zebra!2026#Quartz -c 'ls' >/dev/null 2>&1 && break
              sleep 1
            done
            smbclient //127.0.0.1/fiex -U fiex%Zebra!2026#Quartz -c 'ls' || (cat /tmp/fiex-smbd.log; exit 1)
          elif [ "$RUNNER_OS" = "Windows" ]; then
            powershell.exe -NoProfile -Command "
              \$ErrorActionPreference = 'Stop';
              net accounts /minpwlen:0 | Out-Null;
              if (Get-LocalUser -Name fiex -ErrorAction SilentlyContinue) { Remove-LocalUser -Name fiex };
              New-LocalUser -Name fiex -Password (ConvertTo-SecureString 'Zebra!2026#Quartz' -AsPlainText -Force) -PasswordNeverExpires | Out-Null;
              New-Item -ItemType Directory -Force C:\fiex-smb | Out-Null;
              [IO.File]::WriteAllText('C:\fiex-smb\hello.txt', 'hello smb' + [char]10);
              if (Get-SmbShare -Name fiex -ErrorAction SilentlyContinue) { Remove-SmbShare -Name fiex -Force };
              New-SmbShare -Name fiex -Path C:\fiex-smb -FullAccess (\$env:COMPUTERNAME + '\fiex') | Out-Null;
              icacls C:\fiex-smb /grant 'fiex:(OI)(CI)F' | Out-Null;
              New-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\Lsa -Name LocalAccountTokenFilterPolicy -Value 1 -PropertyType DWord -Force | Out-Null;
              Start-Service LanmanServer
            "
            for i in $(seq 1 30); do
              (echo > /dev/tcp/127.0.0.1/445) >/dev/null 2>&1 && break
              sleep 1
            done
            (echo > /dev/tcp/127.0.0.1/445) >/dev/null 2>&1 || exit 1
          else
            brew install samba
            if ! id fiex >/dev/null 2>&1; then
              sudo sysadminctl -addUser fiex -password 'Zebra!2026#Quartz' -fullName fiex 2>/dev/null || true
            fi
            sudo mkdir -p /Users/Shared/fiex-smb
            printf 'hello smb\n' | sudo tee /Users/Shared/fiex-smb/hello.txt >/dev/null
            sudo chmod 777 /Users/Shared/fiex-smb
            sudo mkdir -p /tmp/fiex-samba/private /tmp/fiex-samba/state /tmp/fiex-samba/cache /tmp/fiex-samba/lock /tmp/fiex-samba/pid
            sudo chmod -R 777 /tmp/fiex-samba
            cat > /tmp/fiex-smb.conf <<'EOF'
          [global]
            workgroup = WORKGROUP
            server role = standalone server
            security = user
            map to guest = Bad User
            guest account = nobody
            server min protocol = SMB2
            smb ports = 10445
            private dir = /tmp/fiex-samba/private
            state directory = /tmp/fiex-samba/state
            cache directory = /tmp/fiex-samba/cache
            lock directory = /tmp/fiex-samba/lock
            pid directory = /tmp/fiex-samba/pid
            ncalrpc dir = /tmp/fiex-samba/private
          [fiex]
            path = /Users/Shared/fiex-smb
            browseable = yes
            read only = no
            guest ok = no
            valid users = fiex
            force user = fiex
          EOF
            printf 'Zebra!2026#Quartz\nZebra!2026#Quartz\n' | sudo /opt/homebrew/bin/pdbedit -a -u fiex -s /tmp/fiex-smb.conf
            sudo launchctl bootout system/com.apple.smbd 2>/dev/null || true
            sudo /opt/homebrew/sbin/samba-dot-org-smbd -s /tmp/fiex-smb.conf --foreground --no-process-group --debug-stdout -d 2 > /tmp/fiex-smbd.log 2>&1 &
            for i in $(seq 1 30); do
              (echo > /dev/tcp/127.0.0.1/10445) >/dev/null 2>&1 && break
              sleep 1
            done
            (echo > /dev/tcp/127.0.0.1/10445) >/dev/null 2>&1 || (cat /tmp/fiex-smbd.log; exit 1)
            echo "FIEX_SMB_PORT=10445" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - run: npm run icons
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Core Rust tests
        shell: bash
        run: |
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib 2>&1 | tee core-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Core test failure'
              echo '```'
              tail -120 core-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -40 core-test.log | sed 's/^/::error title=RUSTTEST::/'
          fi
          exit "$status"
      - name: Driver, WebDAV and SMB tests
        shell: bash
        env:
          FIEX_WEBDAV_URL: http://127.0.0.1:8080/
          FIEX_SMB_HOST: 127.0.0.1
          FIEX_SMB_SHARE: fiex
          FIEX_SMB_USER: fiex
          FIEX_SMB_PASSWORD: Zebra!2026#Quartz
        run: |
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --nocapture 2>&1 | tee integration-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Driver/remote test failure'
              echo '```'
              tail -160 integration-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -50 integration-test.log | sed 's/^/::error title=RUSTTEST::/'
          fi
          exit "$status"
      - name: Clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Clippy failure'
              echo '```'
              sed -n '1,220p' clippy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=CLIPPY-LINES::$(wc -l < clippy.log) lines"
            base64 < clippy.log | tr -d '\n' | head -c 30000 | sed 's/^/::error title=CLIPPY-B64::/'
            grep -a -E -A6 'error(\[|:)|warning:' clippy.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=CLIPPY-DIAG::$line"
            done
          fi
          exit "$status"
      - name: Remote test server logs
        if: failure()
        shell: bash
        run: |
          cat /tmp/fiex-smbd.log 2>/dev/null || true
          cat .ci/smb.log 2>/dev/null || true
          cat .ci/wsgidav.log 2>/dev/null || true
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify self-contained native libraries
        run: npm run audit:native -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          # Installers are already compressed; skip another zip pass so large
          # AppImage/DMG uploads do not stall on the runner.
          compression-level: 0
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
  release:
    name: Publish tested installers
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-input
          merge-multiple: true
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs
