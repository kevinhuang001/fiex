name: Core tests, IPC and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Keep only the latest PR commit in CI. Old builds and uploads should not
# exhaust the macOS/Windows runner queue or masquerade as the current result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Frontend and UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned SDK
        run: git submodule update --init sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose connection dialog Prettier output (temporary)
        run: npx prettier --write src/components/ConnectionDialog.tsx && git diff -- src/components/ConnectionDialog.tsx
      - run: npm run format:check
      - run: npm run check:i18n
      - run: npm test
      - name: Restore checked frontend bundle and native icons
        id: web-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            dist
            src-tauri/icons
          # Exact inputs only: a bundle from different source is never reused.
          key: web-v1-${{ runner.os }}-node22-${{ hashFiles('package.json', 'package-lock.json', 'src/**', 'public/**', 'assets/**', 'scripts/**', 'sdk/ui/**', 'index.html', 'vite.config.*', 'tsconfig*.json', '.env*') }}
      - run: npm run icons
        if: steps.web-cache.outputs.cache-hit != 'true'
      - run: npm run build
        if: steps.web-cache.outputs.cache-hit != 'true'
      - name: Typecheck on a bundle cache hit
        if: steps.web-cache.outputs.cache-hit == 'true'
        run: npx tsc --noEmit
      - name: Save checked frontend bundle and native icons
        if: steps.web-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist
            src-tauri/icons
          key: ${{ steps.web-cache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web-assets
          if-no-files-found: error
          path: |
            dist/
            src-tauri/icons/

  e2e:
    name: Browser UI tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned SDK
        run: git submodule update --init sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            artifacts/
            playwright-report/
            test-results/
  desktop:
    needs: checks
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_CACHE_SIZE: '10G'
      # Keep tests, examples and Clippy in the same explicit-target cache.
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: '0'
      # Core and the SDK mock share dependencies and one target tree.
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned SDK
        run: git submodule update --init sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
          version: 1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Enable sccache
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            sdk/rust -> ../../src-tauri/target
          key: ${{ matrix.target }}
          # Full target outputs are managed separately, without pruning Core.
          cache-targets: false
          cache-all-crates: true
          cache-on-failure: true
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: desktop-web-assets
          path: .
      - name: Compute native build cache identity
        id: native-key
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { appendFileSync } from 'node:fs'
          const hash = (value) => createHash('sha256').update(value).digest('hex')
          const buildEnv = Object.fromEntries(Object.entries(process.env)
            .filter(([name]) => /^(CARGO|RUST|CC|CXX|CFLAGS|CMAKE|ImageOS)/.test(name))
            .sort(([a], [b]) => a.localeCompare(b)))
          const compiler = hash(Buffer.concat([execFileSync('rustc', ['-vV']),
            Buffer.from(JSON.stringify(buildEnv))]))
          // Git object IDs cover tracked native sources, vendor code, config,
          // workflow flags and the exact SDK gitlink; generated targets are absent.
          const source = hash(execFileSync('git', ['ls-files', '--stage', '--',
            'src-tauri', 'sdk', '.cargo', 'rust-toolchain', 'rust-toolchain.toml',
            '.github/workflows/ci.yml']))
          appendFileSync(process.env.GITHUB_OUTPUT, `compiler=${compiler}\nsource=${source}\n`)
          JS
      - name: Restore native Cargo build outputs
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src-tauri/target
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.native-key.outputs.compiler }}-${{ hashFiles('src-tauri/Cargo.lock', 'sdk/rust/Cargo.lock') }}-${{ steps.native-key.outputs.source }}-${{ hashFiles('dist/**', 'src-tauri/icons/**') }}
          restore-keys: |
            native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.native-key.outputs.compiler }}-${{ hashFiles('src-tauri/Cargo.lock', 'sdk/rust/Cargo.lock') }}-
      - name: Core Rust tests
        id: core-tests
        shell: bash
        run: |
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features usbfs --lib 2>&1 | tee core-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Core test failure'
              echo '```'
              tail -120 core-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -40 core-test.log | sed 's/^/::error title=RUSTTEST::/'
          fi
          exit "$status"
      - name: Core IPC integration with an external mock plugin
        shell: bash
        env:
          FIEX_PLUGIN_DIR: ${{ runner.temp }}/fiex-plugin-host-test/plugins
          XDG_DATA_HOME: ${{ runner.temp }}/fiex-plugin-host-test/user-data
        run: |
          set -euo pipefail
          cargo build --manifest-path sdk/rust/Cargo.toml --target "${{ matrix.target }}" --example mock_plugin
          mkdir -p "$FIEX_PLUGIN_DIR/org.fiex.mock"
          cp sdk/rust/fixtures/mock-manifest.json "$FIEX_PLUGIN_DIR/org.fiex.mock/manifest.json"
          executable=mock_plugin
          if [ "$RUNNER_OS" = Windows ]; then executable=mock_plugin.exe; fi
          cp "src-tauri/target/${{ matrix.target }}/debug/examples/$executable" "$FIEX_PLUGIN_DIR/org.fiex.mock/$executable"
          if [ "$RUNNER_OS" != Windows ]; then chmod +x "$FIEX_PLUGIN_DIR/org.fiex.mock/$executable"; fi
          cargo run --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features usbfs --example plugin_smoke -- org.fiex.mock
          cargo run --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features usbfs --example plugin_concurrency
          cargo run --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features usbfs --example plugin_search_e2e
          cargo run --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features usbfs --example plugin_locale
      - name: Windows plugin IPC without console standard handles
        if: runner.os == 'Windows'
        shell: bash
        env:
          FIEX_PLUGIN_DIR: ${{ runner.temp }}/fiex-plugin-host-test/plugins
          XDG_DATA_HOME: ${{ runner.temp }}/fiex-plugin-host-test/user-data
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features usbfs --example plugin_windows_stdio
      - name: Static toolbar panel resolution
        shell: bash
        env:
          FIEX_PLUGIN_DIR: ${{ runner.temp }}/fiex-plugin-host-test/plugins
          XDG_DATA_HOME: ${{ runner.temp }}/fiex-plugin-host-test/user-data
        run: |
          set -euo pipefail
          fixture="$FIEX_PLUGIN_DIR/org.fiex.panels"
          mkdir -p "$fixture/ui/dist"
          cat > "$fixture/manifest.json" <<'JSON'
          {
            "schemaVersion": 2,
            "id": "org.fiex.panels",
            "name": "Panel fixture",
            "version": "1.0.0",
            "runtime": { "protocolVersion": "6.0" },
            "extensions": {
              "toolbar": {
                "title": "Toolbar panel",
                "panel": { "entry": "ui/dist/index.html", "title": "Toolbar" }
              }
            }
          }
          JSON
          cat > "$fixture/ui/dist/index.html" <<'HTML'
          <!doctype html><html><head><title>fixture</title></head><body>panel</body></html>
          HTML
          cargo run --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features usbfs --example plugin_panels -- org.fiex.panels
      - name: macOS sandbox startup diagnostics
        if: failure() && runner.os == 'macOS'
        run: sudo log show --last 5m --style compact --predicate 'process == "sandboxd" OR eventMessage CONTAINS "mock_plugin"' | tail -200
      - name: Clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Clippy failure'
              echo '```'
              sed -n '1,220p' clippy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=CLIPPY-LINES::$(wc -l < clippy.log) lines"
            base64 < clippy.log | tr -d '\n' | head -c 30000 | sed 's/^/::error title=CLIPPY-B64::/'
            grep -a -E -A6 'error(\[|:)|warning:' clippy.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=CLIPPY-DIAG::$line"
            done
          fi
          exit "$status"
      - uses: tauri-apps/tauri-action@v0
        with:
          # The exact frontend and icons checked above are shared by all installers.
          args: >-
            --config '{"build":{"beforeBuildCommand":""}}'
            --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify self-contained native libraries
        run: npm run audit:native -- --target ${{ matrix.target }}
      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
            {
              echo "### sccache"
              echo '```'
              sccache --show-stats
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sccache is not installed" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          # Installers are already compressed; skip another zip pass so large
          # AppImage/DMG uploads do not stall on the runner.
          compression-level: 0
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Trim generated installer bundles from build cache
        if: always() && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' && steps.core-tests.outcome != 'skipped'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { rmSync } from 'node:fs'
          import { join } from 'node:path'
          // Installer artifacts have already been uploaded; cache compiler outputs.
          rmSync(join('src-tauri', 'target', process.env.CARGO_BUILD_TARGET, 'release', 'bundle'), { recursive: true, force: true })
          JS
      - name: Save native Cargo build outputs
        if: always() && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' && steps.core-tests.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            src-tauri/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build cache summary
        if: always()
        shell: bash
        env:
          BUILD_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: |
          echo "### Native Cargo outputs: exact cache hit = ${BUILD_CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish tested installers
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, e2e, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-input
          merge-multiple: true
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs
