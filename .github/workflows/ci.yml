name: Test, build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Give every commit its own concurrency group. A stalled artifact upload in
# one run must not leave newer runs pending behind it forever.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  checks:
    name: Frontend and UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            artifacts/
            playwright-report/
            test-results/
  desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev python3-venv
          version: 1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          cache-all-crates: true
          cache-on-failure: true
      - name: Start WebDAV test server
        shell: bash
        run: |
          set -euo pipefail
          PY=python3
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; fi
          "$PY" -m venv .ci/venv
          if [ "$RUNNER_OS" = "Windows" ]; then VPY=.ci/venv/Scripts/python.exe; else VPY=.ci/venv/bin/python; fi
          "$VPY" -m pip install -q --upgrade pip wsgidav cheroot impacket
          mkdir -p .ci/webdav
          printf 'hello webdav\n' > .ci/webdav/hello.txt
          ROOT="$PWD/.ci/webdav"
          if command -v cygpath >/dev/null 2>&1; then ROOT=$(cygpath -w "$ROOT"); fi
          "$VPY" -c 'from wsgidav.server.server_cli import run; run()' --host=127.0.0.1 --port=8080 --root="$ROOT" --auth=anonymous > .ci/wsgidav.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sS -X PROPFIND -H 'Depth: 1' http://127.0.0.1:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sS -X PROPFIND -H 'Depth: 1' http://127.0.0.1:8080/ >/dev/null || (cat .ci/wsgidav.log; exit 1)
      - name: Start SMB test server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/smb
          printf 'hello smb\n' > .ci/smb/hello.txt
          if [ "$RUNNER_OS" = "Windows" ]; then VPY=.ci/venv/Scripts/python.exe; else VPY=.ci/venv/bin/python; fi
          SMB_SHARE="$PWD/.ci/smb"
          if command -v cygpath >/dev/null 2>&1; then SMB_SHARE=$(cygpath -w "$SMB_SHARE"); fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell.exe -NoProfile -Command "Stop-Service LanmanServer -Force" || true
            SMB_BIN=.ci/venv/Scripts/smbserver.py
            "$VPY" "$SMB_BIN" -smb2support -username fiex -password fiex fiex "$SMB_SHARE" > .ci/smb.log 2>&1 &
          else
            sudo systemctl stop smbd 2>/dev/null || true
            sudo launchctl bootout system/com.apple.smbd 2>/dev/null || true
            SMB_BIN=.ci/venv/bin/smbserver.py
            sudo "$VPY" "$SMB_BIN" -smb2support -username fiex -password fiex fiex "$SMB_SHARE" > .ci/smb.log 2>&1 &
          fi
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/445) >/dev/null 2>&1 && break
            sleep 1
          done
          (echo > /dev/tcp/127.0.0.1/445) >/dev/null 2>&1 || (cat .ci/smb.log; exit 1)
      - run: npm ci
      - run: npm run icons
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Core Rust tests
        shell: bash
        run: |
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib 2>&1 | tee core-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Core test failure'
              echo '```'
              tail -120 core-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -40 core-test.log | sed 's/^/::error title=RUSTTEST::/'
          fi
          exit "$status"
      - name: Driver, WebDAV and SMB tests
        shell: bash
        env:
          FIEX_WEBDAV_URL: http://127.0.0.1:8080/
          FIEX_SMB_HOST: 127.0.0.1
          FIEX_SMB_SHARE: fiex
          FIEX_SMB_USER: fiex
          FIEX_SMB_PASSWORD: fiex
        run: |
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --nocapture 2>&1 | tee integration-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Driver/remote test failure'
              echo '```'
              tail -160 integration-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -50 integration-test.log | sed 's/^/::error title=RUSTTEST::/'
          fi
          exit "$status"
      - name: Clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Clippy failure'
              echo '```'
              sed -n '1,220p' clippy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=CLIPPY-LINES::$(wc -l < clippy.log) lines"
            base64 < clippy.log | tr -d '\n' | head -c 30000 | sed 's/^/::error title=CLIPPY-B64::/'
            grep -a -E -A6 'error(\[|:)|warning:' clippy.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=CLIPPY-DIAG::$line"
            done
          fi
          exit "$status"
      - name: Remote test server logs
        if: failure()
        shell: bash
        run: |
          cat .ci/smbd.log 2>/dev/null || true
          cat .ci/smb.log 2>/dev/null || true
          cat .ci/wsgidav.log 2>/dev/null || true
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify self-contained native libraries
        run: npm run audit:native -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          # Installers are already compressed; skip another zip pass so large
          # AppImage/DMG uploads do not stall on the runner.
          compression-level: 0
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
  release:
    name: Publish tested installers
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-input
          merge-multiple: true
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs
