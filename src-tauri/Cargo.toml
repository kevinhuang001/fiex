[package]
name = "fiex"
version = "0.2.4"
description = "A calm, fast file explorer"
authors = ["Kevin Huang"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "fiex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fiex"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop", "usbfs"]
desktop = [
    "dep:gtk",
    "dep:tauri",
    "dep:tauri-build",
    "dep:objc2",
    "dep:file_icon_provider",
    "dep:image",
    "dep:tauri-plugin-drag",
    "dep:rfd",
]
ci-driver = ["desktop", "usbfs"]
usbfs = ["dep:rust-fs-ntfs", "dep:rust-fs-ext4", "dep:rust-fs-btrfs", "dep:apfs", "dep:hfsplus"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"], optional = true }
tauri-plugin-drag = { version = "2.1.1", optional = true }
rust-fs-ntfs = { version = "0.10", optional = true }
rust-fs-ext4 = { version = "0.8", optional = true }
rust-fs-btrfs = { version = "0.10", optional = true }
apfs = { version = "0.4", optional = true }
hfsplus = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
dunce = "1"
ignore = "0.4"
globset = "0.4"
tantivy = "0.27"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
quick-xml = "0.37"
urlencoding = "2"
httpdate = "1"
smb = "0.12"
futures-util = "0.3"
notify = "8"
trash = "5"
open = "5"
which = "8"
base64 = "0.22"
mime_guess = "2"
zip = { version = "4", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
# Static liblzma: the default build probes pkg-config and can link Homebrew's
# xz dylib, which dyld rejects because a release app is ad-hoc signed.
xz2 = { version = "0.1", features = ["static"] }
sevenz-rust2 = "0.20"
tempfile = "3"
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
file_icon_provider = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
rfd = { version = "0.15", optional = true, default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.15", optional = true, default-features = false }
objc2 = { version = "0.6", optional = true }
plist = "1"
xattr = "1"

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.15", optional = true, default-features = false }
lnk = "0.5"

[profile.release]
strip = true
opt-level = 2

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
