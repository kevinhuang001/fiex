[package]
name = "fiex"
version = "0.7.8"
description = "A calm, fast file explorer"
authors = ["Kevin Huang"]
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[lib]
name = "fiex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fiex"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop", "usbfs"]
desktop = [
    "dep:gtk",
    "dep:tauri",
    "dep:tauri-build",
    "dep:objc2",
    "dep:file_icon_provider",
    "dep:image",
    "dep:tauri-plugin-drag",
    "dep:tauri-plugin-single-instance",
    "dep:rfd",
]
ci-driver = ["desktop", "usbfs"]
usbfs = ["dep:rust-fs-ntfs", "dep:rust-fs-ext4", "dep:rust-fs-btrfs", "dep:apfs", "dep:hfsplus"]
tauri-plugin-single-instance = ["dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
futures = "0.3"
fiex-plugin-sdk = { path = "../sdk/rust" }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"], optional = true }
tauri-plugin-drag = { version = "2.1.1", optional = true }
rust-fs-ntfs = { version = "0.10", optional = true }
rust-fs-ext4 = { version = "0.8", optional = true }
rust-fs-btrfs = { version = "0.10", optional = true }
apfs = { version = "0.4", optional = true }
hfsplus = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
fontdb = "0.23"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
dunce = "1"
cap-std = "3"
ignore = "0.4"
grep-regex = "0.1"
regex = "1"
grep-matcher = "0.1"
shell-words = "1"
reflink-copy = "0.1"
rayon = "1"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking", "json", "system-proxy"] }
urlencoding = "2"
notify = "8"
trash = "5"
open = { version = "5", features = ["shellexecute-on-windows"] }
which = "8"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
getrandom = "0.2"
tokio = { version = "1", features = ["sync", "rt"] }
portable-pty = "0.9"
hex = "0.4"
mime_guess = "2"
zip = { version = "4", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto"] }
tempfile = "3"
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
file_icon_provider = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
lofty = "0.25"
mp4 = "0.14"
matroska = "0.30"
tauri-plugin-single-instance = { version = "2", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
arapuca = { git = "https://github.com/sergio-correia/arapuca.git", rev = "55e40035fb87ef766eedf23bd1c01fd91261c447", default-features = false }
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
arapuca = { git = "https://github.com/sergio-correia/arapuca.git", rev = "55e40035fb87ef766eedf23bd1c01fd91261c447", default-features = false }


[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
gtk = { version = "0.18", optional = true }
rfd = { version = "0.15", optional = true, default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.15", optional = true, default-features = false }
objc2 = { version = "0.6", optional = true }
plist = "1"
xattr = "1"
ds_store = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.15", optional = true, default-features = false }
lnk = "0.5"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 2

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[package.metadata.cargo-machete]
# Imported under their facade names (`fs_ntfs`, `fs_ext4`, `fs_btrfs`).
ignored = ["rust-fs-btrfs", "rust-fs-ext4", "rust-fs-ntfs"]

# Fiex vendors arapuca to drop the Win32k-syscall mitigation that makes every
# COM-importing plugin fail at DLL initialization (0xC0000142) on Windows.
[patch."https://github.com/sergio-correia/arapuca.git"]
arapuca = { path = "vendor/arapuca" }
