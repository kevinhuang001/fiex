[package]
name = "fiex-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { workspace = true }
dirs = { workspace = true }

[target.'cfg(windows)'.dependencies]
dunce = "1"
trash = "5"
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSURL", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.22"

[target.'cfg(not(windows))'.dependencies]
trash = "5"
