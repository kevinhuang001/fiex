[package]
name = "fiex-applications"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
default = []
desktop = [
    "dep:dirs",
]

[dependencies]
fiex-storage = { path = "../../foundation/fiex-storage" }
dirs = { workspace = true, optional = true }
hex = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
urlencoding = "2"
